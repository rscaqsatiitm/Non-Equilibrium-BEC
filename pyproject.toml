[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nebec"
version = "0.1.0"
description = "Ergodic quantum-kinetic model of dissipative distillation of a trapped Bose gas"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "numba>=0.58", "pypdf>=3.0"]

[tool.setuptools]
packages = ["nebec"]
